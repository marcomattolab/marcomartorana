{{ $canonical := .Permalink }}
{{ if eq .Data.Term "ai" }}{{ $canonical = "/ai/" | absURL }}{{ end }}
{{ if eq .Data.Term "informatics" }}{{ $canonical = "/informatics/" | absURL }}{{ end }}

<style>
/* Offset anchor targets below the fixed-top navbar */
h2[id],
h3[id],
h4[id] {
  scroll-margin-top: 90px;
}

/* Homepage hero */
.home-hero {
  margin-top: 130px;
  padding: 3rem 1rem 2.5rem;
  background: linear-gradient(180deg, #f6f4f1 0%, #ffffff 100%);
  border-bottom: 1px solid #eeeeee;
}
.home-hero-title {
  font-weight: 700;
  font-size: clamp(2.1rem, 5vw, 3.4rem);
  letter-spacing: -0.02em;
}
.home-hero-subtitle {
  font-size: 1.15rem;
  color: #4b4f56;
  margin: 0.75rem auto 0;
  max-width: 680px;
}
.home-hero-cta {
  margin-top: 1.5rem;
}
.home-hero-cta .btn {
  margin: 0.3rem 0.25rem;
}
.section-heading {
  font-weight: 700;
  font-size: 1.6rem;
  margin: 1.5rem 0 0.75rem;
}
.featured-section {
  padding: 0.5rem 0 0;
}

/* Tech badges (About page) */
.tech-badge {
  display: inline-block;
  padding: 0.35em 0.8em;
  border-radius: 0.4em;
  color: #ffffff;
  font-weight: 600;
  font-size: 0.85rem;
  line-height: 1;
  margin: 0.15rem;
  white-space: nowrap;
}
.tech-badge-dark {
  color: #1a1a1a;
}

/* Reading progress bar */
#reading-progress {
  position: fixed;
  top: 0;
  left: 0;
  width: 0;
  height: 3px;
  background: linear-gradient(90deg, #ed1b2f, #ff6b6b);
  z-index: 99999;
  transition: width 0.1s ease-out;
}

/* Back to top button */
#back-to-top {
  position: fixed;
  bottom: 1.5rem;
  right: 1.5rem;
  width: 42px;
  height: 42px;
  border-radius: 50%;
  border: none;
  background: #1a1a1a;
  color: #ffffff;
  font-size: 1.1rem;
  display: flex;
  align-items: center;
  justify-content: center;
  opacity: 0;
  visibility: hidden;
  transform: translateY(10px);
  transition: opacity 0.25s ease, transform 0.25s ease, visibility 0.25s;
  z-index: 99999;
  cursor: pointer;
  box-shadow: 0 4px 16px rgba(0, 0, 0, 0.18);
}
#back-to-top.show {
  opacity: 1;
  visibility: visible;
  transform: translateY(0);
}
#back-to-top:hover {
  background: #ed1b2f;
}

/* Card hover lift */
.single-post-card {
  transition: transform 0.25s ease, box-shadow 0.25s ease;
}
.single-post-card:hover {
  transform: translateY(-6px);
  box-shadow: 0 24px 40px rgba(0, 0, 0, 0.14) !important;
}

/* Consistent card image height (preview cards only) */
.single-post-card .card-img-top,
.single-post-card .card-img-bottom {
  height: 190px;
  object-fit: cover;
}

/* Tag chips */
.blog-tags a {
  display: inline-block;
  margin: 0.15rem 0.1rem;
  padding: 0.15rem 0.6rem;
  border-radius: 999px;
  background: #f0f0f0;
  color: #555555;
  font-size: 0.85rem;
  transition: background 0.2s ease, color 0.2s ease;
}
.blog-tags a:before {
  content: "#";
  opacity: 0.6;
}
.blog-tags a:hover {
  background: #ed1b2f;
  color: #ffffff;
}

/* Reading experience (single post) */
.blog-post {
  font-size: 1.06rem;
  line-height: 1.75;
}
.blog-post h2 {
  margin-top: 2.2rem;
  margin-bottom: 1rem;
  font-weight: 700;
}
.blog-post h3 {
  margin-top: 1.8rem;
  font-weight: 600;
}
.blog-post a {
  text-decoration: underline;
  text-decoration-color: #ed1b2f;
  text-underline-offset: 3px;
}
.blog-post a:hover {
  color: #ed1b2f;
}
.blog-post img {
  border-radius: 8px;
}
.blog-post blockquote {
  border-left: 3px solid #ed1b2f;
  padding-left: 1rem;
  margin: 1.5rem 0;
}
.blog-post table th {
  background: #f5f5f5;
}

/* Featured carousel */
.featured-carousel {
  border-radius: 16px;
  overflow: hidden;
  box-shadow: 0 20px 40px rgba(0, 0, 0, 0.15);
  background: #1c1f24;
}
.featured-slide {
  display: flex;
  flex-direction: column;
  background: #1c1f24;
}
.featured-slide-media {
  width: 100%;
  height: 220px;
  overflow: hidden;
  flex: 0 0 auto;
}
.featured-slide-media img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  object-position: center;
  display: block;
}
.featured-slide-body {
  flex: 1;
  padding: 1.5rem 1.75rem 2rem;
  color: #ffffff;
  display: flex;
  flex-direction: column;
  justify-content: center;
}
.featured-slide-title {
  font-weight: 700;
  font-size: 1.5rem;
  margin: 0.5rem 0;
}
.featured-slide-desc {
  opacity: 0.9;
  margin-bottom: 0.75rem;
}
.featured-slide-link {
  font-weight: 600;
  font-size: 0.9rem;
}
.featured-slide-link i {
  transition: transform 0.2s ease;
}
.featured-slide:hover .featured-slide-link i {
  transform: translateX(4px);
}
.featured-carousel .carousel-control-prev,
.featured-carousel .carousel-control-next {
  width: 8%;
}

@media (min-width: 768px) {
  .featured-slide {
    flex-direction: row;
    min-height: 400px;
  }
  .featured-slide-media {
    width: 55%;
    flex: 0 0 55%;
    height: auto;
    min-height: 400px;
  }
  .featured-slide-body {
    padding: 2rem 2.25rem;
  }
}

/* Table of contents (single post) */
.post-toc {
  background: #f8f9fa;
  border: 1px solid #eeeeee;
  border-left: 4px solid #ed1b2f;
  border-radius: 10px;
  padding: 1rem 1.25rem;
  margin-bottom: 1.5rem;
}
.post-toc-summary {
  font-weight: 700;
  cursor: pointer;
  font-size: 1rem;
  list-style-position: outside;
}
.post-toc-body {
  margin-top: 0.75rem;
  font-size: 0.95rem;
}
.post-toc-body ul {
  list-style: none;
  padding-left: 0;
  margin: 0;
}
.post-toc-body li {
  margin: 0.3rem 0;
}
.post-toc-body a {
  color: #4b4f56;
  text-decoration: none;
}
.post-toc-body a:hover {
  color: #ed1b2f;
}
.post-toc-body ul ul {
  padding-left: 1.1rem;
}
</style>

<style id="dark-mode-overrides">
/* Curated dark mode (replaces the theme's invert filter) */
:root[data-theme="dark"] {
  filter: none !important;
  -webkit-filter: none !important;
  background-color: #111418 !important;
  color-scheme: dark;
}
:root[data-theme="dark"] body {
  background-color: #111418 !important;
  color: #e6e8eb;
}
:root[data-theme="dark"] img,
:root[data-theme="dark"] video,
:root[data-theme="dark"] iframe,
:root[data-theme="dark"] body [style*="background-image"] {
  filter: none !important;
  -webkit-filter: none !important;
}

/* Typography */
:root[data-theme="dark"] .post-title,
:root[data-theme="dark"] .post-preview a,
:root[data-theme="dark"] a {
  color: #e6e8eb;
}
:root[data-theme="dark"] .post-title:hover,
:root[data-theme="dark"] .post-preview a:hover,
:root[data-theme="dark"] a:hover {
  color: #ff6b6b;
}
:root[data-theme="dark"] .post-meta,
:root[data-theme="dark"] .page-meta,
:root[data-theme="dark"] blockquote,
:root[data-theme="dark"] .text-muted {
  color: #9aa0a6 !important;
}
:root[data-theme="dark"] .post-preview .post-meta a,
:root[data-theme="dark"] .post-heading .post-meta a {
  color: #9aa0a6;
}

/* Navbar */
:root[data-theme="dark"] .navbar,
:root[data-theme="dark"] .nav-link {
  background-color: rgba(17, 20, 24, 0.98) !important;
}
:root[data-theme="dark"] .navbar-brand,
:root[data-theme="dark"] .navbar .nav-link {
  color: #e6e8eb;
}
:root[data-theme="dark"] .navbar .nav-link:hover,
:root[data-theme="dark"] .navbar .nav-link.active {
  color: #ff6b6b;
}
:root[data-theme="dark"] .dropdown-menu {
  background-color: #1c1f24;
  border-color: #2a2e34;
}
:root[data-theme="dark"] .dropdown-item {
  color: #e6e8eb;
}
:root[data-theme="dark"] .dropdown-item:hover {
  background-color: #2a2e34;
  color: #ffffff;
}

/* Cards & surfaces */
:root[data-theme="dark"] .single-post-card,
:root[data-theme="dark"] .single-post-card-haiku,
:root[data-theme="dark"] .bg-faded-light,
:root[data-theme="dark"] .card,
:root[data-theme="dark"] .well {
  background-color: #1c1f24;
  color: #e6e8eb;
}
:root[data-theme="dark"] .bg-black {
  background-color: #171a1e;
}
:root[data-theme="dark"] .single-post-card {
  box-shadow: 0 20px 20px rgba(0, 0, 0, 0.35);
}
:root[data-theme="dark"] .single-post-card:hover {
  box-shadow: 0 24px 40px rgba(0, 0, 0, 0.5) !important;
}
:root[data-theme="dark"] .home-intro-section {
  background-color: #1c1f24;
  color: #e6e8eb;
}
:root[data-theme="dark"] .header-section.has-img .no-img {
  background: #171a1e;
}

/* Hero */
:root[data-theme="dark"] .home-hero {
  background: linear-gradient(180deg, #171a1e 0%, #111418 100%);
  border-bottom-color: #2a2e34;
}
:root[data-theme="dark"] .home-hero-subtitle {
  color: #9aa0a6;
}

/* Tables */
:root[data-theme="dark"] table tr {
  background-color: #1c1f24;
  border-top-color: #2a2e34;
}
:root[data-theme="dark"] table tr:nth-child(2n) {
  background-color: #171a1e;
}
:root[data-theme="dark"] table tr th,
:root[data-theme="dark"] table tr td {
  border-color: #2a2e34;
}
:root[data-theme="dark"] .blog-post table th {
  background: #24282e;
}

/* Tags */
:root[data-theme="dark"] .blog-tags a {
  background: #24282e;
  color: #c5c9cf;
}
:root[data-theme="dark"] .blog-tags a:hover {
  background: #ed1b2f;
  color: #ffffff;
}

/* TOC */
:root[data-theme="dark"] .post-toc {
  background: #1c1f24;
  border-color: #2a2e34;
  border-left-color: #ed1b2f;
}
:root[data-theme="dark"] .post-toc-body a {
  color: #c5c9cf;
}
:root[data-theme="dark"] .post-toc-body a:hover {
  color: #ff6b6b;
}

/* Pagination & buttons */
:root[data-theme="dark"] .page-link {
  color: #e6e8eb;
  background-color: #1c1f24;
  border-color: #2a2e34;
}
:root[data-theme="dark"] .page-item.active .page-link {
  background-color: #ed1b2f;
  border-color: #ed1b2f;
  color: #ffffff;
}
:root[data-theme="dark"] .btn-dark {
  background-color: #e6e8eb;
  border-color: #e6e8eb;
  color: #111418;
}
:root[data-theme="dark"] .btn-outline-dark {
  border-color: #e6e8eb;
  color: #e6e8eb;
}
:root[data-theme="dark"] .btn-outline-dark:hover {
  background-color: #e6e8eb;
  color: #111418;
}

/* Footer */
:root[data-theme="dark"] footer .footer-links a {
  color: #e6e8eb;
}
:root[data-theme="dark"] footer .credits a {
  color: #c5c9cf;
}

/* Search */
:root[data-theme="dark"] .search-input {
  color: #e6e8eb;
}

/* Back to top */
:root[data-theme="dark"] #back-to-top {
  background: #2a2e34;
  color: #ffffff;
}
:root[data-theme="dark"] #back-to-top:hover {
  background: #ed1b2f;
}
:root[data-theme="dark"] .featured-carousel {
  border: 1px solid #2a2e34;
}
</style>

<style id="site-assistant-css">
/* Site assistant chat widget */
.chat-toggle {
  position: fixed;
  bottom: 1.5rem;
  left: 1.5rem;
  width: 52px;
  height: 52px;
  border-radius: 50%;
  border: none;
  background: #ed1b2f;
  color: #ffffff;
  font-size: 1.4rem;
  display: flex;
  align-items: center;
  justify-content: center;
  box-shadow: 0 6px 20px rgba(0, 0, 0, 0.25);
  cursor: pointer;
  z-index: 99999;
  transition: transform 0.2s ease, background 0.2s ease;
}
.chat-toggle:hover {
  transform: scale(1.08);
  background: #c8102e;
}
.chat-panel {
  position: fixed;
  bottom: 5.5rem;
  left: 1.5rem;
  width: 360px;
  max-width: calc(100vw - 2rem);
  height: 480px;
  max-height: calc(100vh - 8rem);
  display: flex;
  flex-direction: column;
  background: #1c1f24;
  border-radius: 16px;
  box-shadow: 0 12px 40px rgba(0, 0, 0, 0.35);
  overflow: hidden;
  z-index: 99999;
}
.chat-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0.85rem 1.1rem;
  background: #171a1e;
  color: #ffffff;
  border-bottom: 1px solid #2a2e34;
}
.chat-header-title {
  font-weight: 700;
  font-size: 1rem;
}
.chat-header-title i {
  color: #ed1b2f;
  margin-right: 0.4rem;
}
.chat-close {
  background: none;
  border: none;
  color: #9aa0a6;
  font-size: 1.5rem;
  line-height: 1;
  cursor: pointer;
}
.chat-close:hover {
  color: #ffffff;
}
.chat-messages {
  flex: 1;
  overflow-y: auto;
  padding: 1rem;
  display: flex;
  flex-direction: column;
  gap: 0.6rem;
}
.chat-msg {
  max-width: 85%;
  padding: 0.6rem 0.85rem;
  border-radius: 14px;
  font-size: 0.92rem;
  line-height: 1.45;
  word-wrap: break-word;
}
.chat-msg.bot {
  align-self: flex-start;
  background: #2a2e34;
  color: #e6e8eb;
  border-bottom-left-radius: 4px;
}
.chat-msg.user {
  align-self: flex-end;
  background: #ed1b2f;
  color: #ffffff;
  border-bottom-right-radius: 4px;
}
.chat-msg a {
  color: #ff8a94;
}
.chat-suggestions {
  display: flex;
  flex-wrap: wrap;
  gap: 0.4rem;
  padding: 0.5rem 1rem;
}
.chat-chip {
  border: 1px solid #3a3f46;
  background: transparent;
  color: #c5c9cf;
  border-radius: 999px;
  padding: 0.25rem 0.7rem;
  font-size: 0.8rem;
  cursor: pointer;
  transition: all 0.15s ease;
}
.chat-chip:hover {
  background: #2a2e34;
  color: #ffffff;
  border-color: #ed1b2f;
}
.chat-input-row {
  display: flex;
  gap: 0.5rem;
  padding: 0.6rem 0.85rem;
  border-top: 1px solid #2a2e34;
  background: #171a1e;
}
.chat-input-row input {
  flex: 1;
  border: 1px solid #2a2e34;
  background: #1c1f24;
  color: #e6e8eb;
  border-radius: 999px;
  padding: 0.5rem 0.9rem;
  font-size: 0.9rem;
  outline: none;
}
.chat-input-row input:focus {
  border-color: #ed1b2f;
}
.chat-send {
  border: none;
  background: #ed1b2f;
  color: #ffffff;
  width: 38px;
  height: 38px;
  border-radius: 50%;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  flex: 0 0 auto;
  transition: background 0.15s ease;
}
.chat-send:hover {
  background: #c8102e;
}
.chat-results {
  display: flex;
  flex-direction: column;
  gap: 0.5rem;
  margin-top: 0.5rem;
}
.chat-result {
  display: block;
  background: #24282e;
  border-radius: 10px;
  padding: 0.55rem 0.75rem;
  text-decoration: none !important;
  color: #e6e8eb !important;
  transition: background 0.15s ease;
}
.chat-result:hover {
  background: #2f343c;
}
.chat-result-title {
  display: block;
  font-weight: 600;
  font-size: 0.88rem;
}
.chat-result-desc {
  display: block;
  font-size: 0.78rem;
  color: #9aa0a6;
  margin-top: 0.15rem;
}
@media (max-width: 480px) {
  .chat-panel {
    left: 0.75rem;
    bottom: 5.25rem;
  }
  .chat-toggle {
    left: 0.75rem;
    bottom: 1.25rem;
  }
}
</style>
